<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso privado · CrazyPig</title><link rel="icon" href="/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#101b23;color:#edf1ee;font:16px system-ui}main{width:min(440px,calc(100% - 36px));padding:38px;border:1px solid #36424b;background:#182630;border-radius:16px}img{width:56px}small{display:block;color:#e9bd74;letter-spacing:.16em;margin-top:20px}h1{font-size:30px;margin:10px 0}p{color:#aebdc5;line-height:1.6}label{display:block;margin:24px 0 8px}input,button{width:100%;padding:14px;border-radius:8px;font:inherit}input{background:#101b23;border:1px solid #526674;color:white}button{margin-top:16px;background:#ebc07b;color:#1b2326;border:0;cursor:pointer;font-weight:700}a{color:#d2b485;font-size:14px}#error{color:#ffb8a4;min-height:24px}code{font-size:12px;overflow-wrap:anywhere}</style></head><body><main><img src="/favicon.svg" alt="CrazyPig"><small>CRAZYPIG · ADMINISTRACIÓN</small><h1>La sala de control.</h1><p>Acceso privado desde este ordenador. Los jugadores no ven este panel.</p><form><label for="password">Clave de administrador CrazyPig</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>Entrar al panel</button><p id="error" role="alert"></p></form><p>La clave local está en <code>~/.config/crazypig/admin.json</code>, campo <code>password</code>. Es independiente de tu cuenta TradingView.</p><a href="/">← Volver al valle</a></main><script>
document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;try{const response=await fetch('/api/admin/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});const data=await response.json();if(response.ok)location.reload();else document.querySelector('#error').textContent=data.error;}catch{document.querySelector('#error').textContent='No se pudo contactar con el servidor.';}finally{button.disabled=false;}});
</script></body></html>
